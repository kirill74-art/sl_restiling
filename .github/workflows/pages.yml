name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          test -s index.html
          mkdir -p _site/basis
          cp index.html _site/index.html
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 "https://tevy.dev/models/family-sedan/v1/lod1.glb" -o _site/family-sedan.glb
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/libs/basis/basis_transcoder.js" -o _site/basis/basis_transcoder.js
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/libs/basis/basis_transcoder.wasm" -o _site/basis/basis_transcoder.wasm
          test -s _site/index.html
          test -s _site/family-sedan.glb
          test -s _site/basis/basis_transcoder.js
          test -s _site/basis/basis_transcoder.wasm
          printf '' > _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
